name: Development Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: development-release
  cancel-in-progress: false

jobs:
  version:
    name: Select next semantic version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      - name: Find next unpublished pre-1.0 version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          max_patch=0
          while IFS= read -r tag; do
            if [[ "${tag}" =~ ^v0\.0\.([0-9]+)$ ]]; then
              patch="${BASH_REMATCH[1]}"
              if (( patch > max_patch )); then
                max_patch="${patch}"
              fi
            fi
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[].tag_name'
          )
          version="0.0.$((max_patch + 1))"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Selected Sonora v${version}"

  build-macos:
    name: Build macOS ${{ matrix.architecture }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Confirm runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"

      - name: Build and ad-hoc sign development app
        env:
          CONFIGURATION: debug
        run: make macos app

      - name: Verify app and embedded helper
        run: |
          test -x macos/dist/Sonora.app/Contents/MacOS/Sonora
          test -x macos/dist/Sonora.app/Contents/MacOS/sonora-server
          test -f macos/dist/Sonora.app/Contents/Resources/Montserrat-Variable.ttf
          plutil -lint macos/dist/Sonora.app/Contents/Info.plist
          plutil -lint macos/dist/Sonora.app/Contents/Library/LaunchAgents/com.sonora.server.plist
          codesign --verify --deep --strict --verbose=2 macos/dist/Sonora.app

      - name: Smoke-test packaged app launch
        run: |
          macos/dist/Sonora.app/Contents/MacOS/Sonora \
            >"${RUNNER_TEMP}/sonora-launch.log" 2>&1 &
          app_pid=$!
          sleep 3
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            cat "${RUNNER_TEMP}/sonora-launch.log"
            wait "${app_pid}" || true
            echo "Sonora exited during the launch smoke test" >&2
            exit 1
          fi
          kill "${app_pid}" 2>/dev/null || true
          wait "${app_pid}" || true

      - name: Package downloadable app
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          asset="Sonora-v${VERSION}-macos-${ARCHITECTURE}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            macos/dist/Sonora.app "${asset}"
          shasum -a 256 "${asset}" > "${asset}.sha256"

      - name: Upload signed app for release job
        uses: actions/upload-artifact@v4
        with:
          name: sonora-v${{ needs.version.outputs.version }}-${{ matrix.architecture }}
          path: |
            Sonora-v${{ needs.version.outputs.version }}-macos-${{ matrix.architecture }}.zip
            Sonora-v${{ needs.version.outputs.version }}-macos-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish development prerelease
    needs:
      - version
      - build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download signed apps
        uses: actions/download-artifact@v4
        with:
          pattern: sonora-v${{ needs.version.outputs.version }}-*
          merge-multiple: true

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          notes="Automated ad-hoc-signed Sonora ${VERSION} build from commit ${GITHUB_SHA}.

          These builds are not notarized. Follow the README launch commands after downloading the archive for your Mac architecture."
          assets=(
            Sonora-v"${VERSION}"-macos-*.zip
            Sonora-v"${VERSION}"-macos-*.zip.sha256
          )
          if gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              "${assets[@]}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sonora v${VERSION}" \
              --notes "${notes}" \
              --prerelease
          else
            gh release create "${tag}" \
              "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Sonora v${VERSION}" \
              --notes "${notes}" \
              --prerelease
          fi
