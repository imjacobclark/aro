name: Development Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: development-release
  cancel-in-progress: false

jobs:
  version:
    name: Select next semantic version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      - name: Find next unpublished pre-1.0 version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          max_patch=0
          while IFS= read -r tag; do
            if [[ "${tag}" =~ ^v0\.0\.([0-9]+)$ ]]; then
              patch="${BASH_REMATCH[1]}"
              if (( patch > max_patch )); then
                max_patch="${patch}"
              fi
            fi
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[].tag_name'
          )
          version="0.0.$((max_patch + 1))"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Selected Aro v${version}"

  build-macos:
    name: Build macOS ${{ matrix.architecture }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Confirm runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "${EXPECTED_ARCHITECTURE}"

      # Same libraries CI installs. Without them audiopus_sys stops looking for a
      # system libopus and tries to build its bundled copy from source, which needs
      # autotools the runner does not have — so the failure surfaces as a missing
      # `autoreconf` rather than a missing library.
      - name: Install libchromaprint and libopus
        run: brew install chromaprint opus pkgconf

      - name: Build and ad-hoc sign development app
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          CONFIGURATION: debug
        run: make macos app

      - name: Verify app and embedded helper
        run: |
          test -x macos/dist/Aro.app/Contents/MacOS/Aro
          test -x macos/dist/Aro.app/Contents/MacOS/aro-server
          test -f macos/dist/Aro.app/Contents/Resources/Montserrat-Variable.ttf
          plutil -lint macos/dist/Aro.app/Contents/Info.plist
          test "$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              macos/dist/Aro.app/Contents/Info.plist
          )" = "${APP_VERSION}"
          test "$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleVersion' \
              macos/dist/Aro.app/Contents/Info.plist
          )" = "${BUILD_NUMBER}"
          plutil -lint macos/dist/Aro.app/Contents/Library/LaunchAgents/com.aro.server.plist
          codesign --verify --strict \
            --test-requirement '=identifier "com.imjacobclark.aro.server"' \
            macos/dist/Aro.app/Contents/MacOS/aro-server
          codesign --verify --deep --strict --verbose=2 macos/dist/Aro.app
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Smoke-test packaged app launch
        run: |
          macos/dist/Aro.app/Contents/MacOS/Aro \
            >"${RUNNER_TEMP}/aro-launch.log" 2>&1 &
          app_pid=$!
          sleep 3
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            cat "${RUNNER_TEMP}/aro-launch.log"
            wait "${app_pid}" || true
            echo "Aro exited during the launch smoke test" >&2
            exit 1
          fi
          kill "${app_pid}" 2>/dev/null || true
          wait "${app_pid}" || true

      - name: Package downloadable app
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          asset="Aro-v${VERSION}-macos-${ARCHITECTURE}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            macos/dist/Aro.app "${asset}"
          shasum -a 256 "${asset}" > "${asset}.sha256"

      - name: Upload signed app for release job
        uses: actions/upload-artifact@v4
        with:
          name: aro-v${{ needs.version.outputs.version }}-${{ matrix.architecture }}
          path: |
            Aro-v${{ needs.version.outputs.version }}-macos-${{ matrix.architecture }}.zip
            Aro-v${{ needs.version.outputs.version }}-macos-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  build-linux-armv7:
    name: Build Linux ARMv7 server
    needs: version
    # Match the oldest supported standalone deployment (Mercury/Ubuntu 22.04)
    # so the released GNU binary does not require a newer glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: armv7-unknown-linux-gnueabihf

      # A cross compiler alone is not enough: aro-track-id links the real libchromaprint
      # and libopus, so the *target's* libraries have to be present too. Ubuntu's main
      # archive carries amd64/i386 only, so armhf packages come from ports.ubuntu.com —
      # and the existing sources must be pinned to amd64 first, or apt tries to fetch
      # armhf from an archive that has never held it and the update fails outright.
      - name: Install ARMv7 cross compiler and target libraries
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i 's|^deb \(http\|mirror+file\)|deb [arch=amd64] \1|' \
            /etc/apt/sources.list
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          codename="$(lsb_release -cs)"
          sudo tee /etc/apt/sources.list.d/armhf-ports.list >/dev/null <<EOF
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${codename} main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports ${codename}-updates main universe
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf pkg-config \
            libchromaprint-dev:armhf libopus-dev:armhf

      - name: Build server
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          # pkg-config refuses to answer for a target other than the host unless told
          # this is deliberate, and must be pointed at the armhf multiarch directory so
          # it reports the target's libraries rather than the runner's own amd64 ones.
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig
        run: >-
          cargo build --locked --release
          --manifest-path server/Cargo.toml
          --target armv7-unknown-linux-gnueabihf
          -p aro-server

      - name: Package server
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          asset="aro-server-v${VERSION}-linux-armv7.tar.gz"
          tar -C server/target/armv7-unknown-linux-gnueabihf/release \
            -czf "${asset}" aro-server
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Upload server for release job
        uses: actions/upload-artifact@v4
        with:
          name: aro-server-v${{ needs.version.outputs.version }}-linux-armv7
          path: |
            aro-server-v${{ needs.version.outputs.version }}-linux-armv7.tar.gz
            aro-server-v${{ needs.version.outputs.version }}-linux-armv7.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish development prerelease
    needs:
      - version
      - build-macos
      - build-linux-armv7
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download signed apps
        uses: actions/download-artifact@v4
        with:
          pattern: aro-v${{ needs.version.outputs.version }}-*
          merge-multiple: true

      - name: Download Linux server
        uses: actions/download-artifact@v4
        with:
          name: aro-server-v${{ needs.version.outputs.version }}-linux-armv7

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          notes="Automated ad-hoc-signed Aro ${VERSION} build from commit ${GITHUB_SHA}.

          These builds are not notarized. Follow the README launch commands after downloading the archive for your Mac architecture."
          assets=(
            Aro-v"${VERSION}"-macos-*.zip
            Aro-v"${VERSION}"-macos-*.zip.sha256
            aro-server-v"${VERSION}"-linux-armv7.tar.gz
            aro-server-v"${VERSION}"-linux-armv7.tar.gz.sha256
          )
          if gh release view "${tag}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              "${assets[@]}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Aro v${VERSION}" \
              --notes "${notes}" \
              --prerelease
          else
            gh release create "${tag}" \
              "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Aro v${VERSION}" \
              --notes "${notes}" \
              --prerelease
          fi
