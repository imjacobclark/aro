name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  legacy-brand:
    name: Legacy brand audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-legacy-brand.sh

  marketing-website:
    name: Marketing website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing-website/package-lock.json
      - run: npm ci
        working-directory: marketing-website
      - run: npm run check:content
        working-directory: marketing-website
      - run: npm run lint
        working-directory: marketing-website
      - run: npm run build
        working-directory: marketing-website

  rust:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # aro-track-id links the real libchromaprint (see its fingerprint.rs) via
      # pkg-config at build time — install it per-platform before anything else.
      - name: Install libchromaprint and libopus (macOS)
        if: runner.os == 'macOS'
        run: brew install chromaprint opus pkgconf
      - name: Install libchromaprint and libopus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libchromaprint-dev libopus-dev pkg-config
      - name: Install libchromaprint (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install chromaprint:x64-windows opus:x64-windows
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV
      - run: cargo test --manifest-path server/Cargo.toml --workspace
      - run: cargo clippy --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

  swift-and-helper:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install libchromaprint and libopus
        run: brew install chromaprint opus pkgconf
      - run: swift test --package-path common
      - name: Test Swift and Rust pairing interoperability
        run: |
          cargo build --manifest-path server/Cargo.toml -p aro-server
          pairing_root="${RUNNER_TEMP}/pairing-hub"
          mkdir -p "${pairing_root}"
          server/target/debug/aro-server \
            --config "${pairing_root}/config.toml" \
            init \
            --data-dir "${pairing_root}/data" \
            --display-name "CI Pairing Hub"
          ARO_BIND=127.0.0.1:49488 \
            server/target/debug/aro-server \
            --config "${pairing_root}/config.toml" \
            serve >"${pairing_root}/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            test -S "${pairing_root}/data/control.sock" && break
            sleep 1
          done
          test -S "${pairing_root}/data/control.sock" || {
            cat "${pairing_root}/server.log"
            exit 1
          }
          ARO_LIVE_PAIRING_URL=https://127.0.0.1:49488 \
            ARO_LIVE_PAIRING_DATA_DIR="${pairing_root}/data" \
            swift test --package-path macos
      - run: make macos app
      - run: test -x macos/dist/Aro.app/Contents/MacOS/aro-server
      - run: test -f macos/dist/Aro.app/Contents/Resources/Montserrat-Variable.ttf
      - run: plutil -lint macos/dist/Aro.app/Contents/Library/LaunchAgents/com.aro.server.plist
      - run: codesign --verify --deep --strict macos/dist/Aro.app
      - name: Smoke-test packaged app launch
        run: |
          macos/dist/Aro.app/Contents/MacOS/Aro \
            >"${RUNNER_TEMP}/aro-launch.log" 2>&1 &
          app_pid=$!
          sleep 3
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            cat "${RUNNER_TEMP}/aro-launch.log"
            wait "${app_pid}" || true
            echo "Aro exited during the launch smoke test" >&2
            exit 1
          fi
          kill "${app_pid}" 2>/dev/null || true
          wait "${app_pid}" || true

  docker:
    name: docker (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
