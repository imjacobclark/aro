name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo test --manifest-path server/Cargo.toml --workspace
      - run: cargo clippy --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

  swift-and-helper:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path common
      - run: swift test --package-path macos
      - run: make macos app
      - run: test -x macos/dist/Sonora.app/Contents/MacOS/sonora-server
      - run: plutil -lint macos/dist/Sonora.app/Contents/Library/LaunchAgents/com.sonora.server.plist
      - run: codesign --verify --deep --strict macos/dist/Sonora.app

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
