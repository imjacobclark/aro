name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo test --manifest-path server/Cargo.toml --workspace
      - run: cargo clippy --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

  swift-and-helper:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path common
      - name: Test Swift and Rust pairing interoperability
        run: |
          cargo build --manifest-path server/Cargo.toml -p sonora-server
          pairing_root="${RUNNER_TEMP}/pairing-hub"
          mkdir -p "${pairing_root}"
          server/target/debug/sonora-server \
            --config "${pairing_root}/config.toml" \
            init \
            --data-dir "${pairing_root}/data" \
            --display-name "CI Pairing Hub"
          SONORA_BIND=127.0.0.1:49488 \
            server/target/debug/sonora-server \
            --config "${pairing_root}/config.toml" \
            serve >"${pairing_root}/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            test -S "${pairing_root}/data/control.sock" && break
            sleep 1
          done
          test -S "${pairing_root}/data/control.sock" || {
            cat "${pairing_root}/server.log"
            exit 1
          }
          SONORA_LIVE_PAIRING_URL=https://127.0.0.1:49488 \
            SONORA_LIVE_PAIRING_DATA_DIR="${pairing_root}/data" \
            swift test --package-path macos
      - run: make macos app
      - run: test -x macos/dist/Sonora.app/Contents/MacOS/sonora-server
      - run: test -f macos/dist/Sonora.app/Contents/Resources/Montserrat-Variable.ttf
      - run: plutil -lint macos/dist/Sonora.app/Contents/Library/LaunchAgents/com.sonora.server.plist
      - run: codesign --verify --deep --strict macos/dist/Sonora.app
      - name: Smoke-test packaged app launch
        run: |
          macos/dist/Sonora.app/Contents/MacOS/Sonora \
            >"${RUNNER_TEMP}/sonora-launch.log" 2>&1 &
          app_pid=$!
          sleep 3
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            cat "${RUNNER_TEMP}/sonora-launch.log"
            wait "${app_pid}" || true
            echo "Sonora exited during the launch smoke test" >&2
            exit 1
          fi
          kill "${app_pid}" 2>/dev/null || true
          wait "${app_pid}" || true

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
