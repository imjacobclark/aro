name: Marketing Website

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Development Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build release-aware website
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing-website/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Find current Aro release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          release="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases" |
              jq --arg commit "${RELEASE_COMMIT}" '
                add
                | map(select(
                    .prerelease == true
                    and (.tag_name | test("^v0\\.0\\.[0-9]+$"))
                  ))
                | (map(select(.target_commitish == $commit)) | last)
                  // (sort_by(.published_at) | last)
              '
          )"
          test "${release}" != "null"

          version="$(jq -r '.tag_name | sub("^v"; "")' <<<"${release}")"
          arm64_name="Aro-v${version}-macos-arm64.zip"
          intel_name="Aro-v${version}-macos-x86_64.zip"
          arm64_url="$(
            jq -r --arg name "${arm64_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${release}"
          )"
          intel_url="$(
            jq -r --arg name "${intel_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${release}"
          )"
          arm64_checksum_url="$(
            jq -r --arg name "${arm64_name}.sha256" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${release}"
          )"
          intel_checksum_url="$(
            jq -r --arg name "${intel_name}.sha256" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<<"${release}"
          )"

          test -n "${arm64_url}"
          test -n "${intel_url}"
          test -n "${arm64_checksum_url}"
          test -n "${intel_checksum_url}"

          {
            echo "NEXT_PUBLIC_ARO_VERSION=${version}"
            echo "NEXT_PUBLIC_ARM64_DOWNLOAD_URL=${arm64_url}"
            echo "NEXT_PUBLIC_INTEL_DOWNLOAD_URL=${intel_url}"
            echo "NEXT_PUBLIC_ARM64_CHECKSUM_URL=${arm64_checksum_url}"
            echo "NEXT_PUBLIC_INTEL_CHECKSUM_URL=${intel_checksum_url}"
          } >> "${GITHUB_ENV}"

      - name: Install website dependencies
        run: npm ci
        working-directory: marketing-website

      - name: Validate audited feature catalogue
        run: npm run check:content
        working-directory: marketing-website

      - name: Lint website
        run: npm run lint
        working-directory: marketing-website

      - name: Build static website
        run: npm run build
        working-directory: marketing-website

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: marketing-website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
