[workspace]
resolver = "2"
members = [
    "crates/sonora-sync-protocol",
    "crates/sonora-sync-core",
    "crates/sonora-sync-store",
    "crates/sonora-server",
    "crates/sonora-sync-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "json", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
fs2 = "0.4"
http = "1.3"
libc = "0.2"
mdns-sd = "0.15"
matter-crypto = "0.2"
notify = "8.2"
parking_lot = "0.12"
rand = "0.9"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "uuid"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.17", features = ["serde", "v4"] }
walkdir = "2.5"

[patch.crates-io]
# matter-crypto 0.2.0 assumes 64-bit limbs for its 320-bit PAKE
# reduction. The architecture-specific U320 alias is required on ARMv7.
matter-crypto = { path = "vendor/matter-crypto" }
